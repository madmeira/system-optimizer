changelog:
  exclude:
    labels:
      - duplicate
      - invalid
      - wontfix
  categories:
    - title: Security
      labels:
        - security
    - title: New Targets & Features
      labels:
        - new-target
        - enhancement
    - title: Bug Fixes
      labels:
        - bug
    - title: Documentation
      labels:
        - documentation
    - title: CI & Maintenance
      labels:
        - ci
        - dependencies
    - title: Other Changes
      labels:
        - "*"
