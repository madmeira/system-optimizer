name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  validate:
    name: Validate Scripts & Schema
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Bash Script Syntax
        shell: bash
        run: |
          for script in scripts/*.sh tests/*.sh; do
            echo "Checking syntax: $script"
            bash -n "$script"
          done

      - name: Lint with ShellCheck
        if: runner.os == 'Linux'
        shell: bash
        run: shellcheck -S warning scripts/*.sh tests/*.sh

      - name: Locate Python
        shell: bash
        run: |
          PY="$(command -v python3 || command -v python || true)"
          if [ -z "$PY" ]; then
            echo "::error::python3/python not found on this runner; cannot validate JSON"
            exit 1
          fi
          echo "PY=$PY" >> "$GITHUB_ENV"

      - name: Test Hardware & Target Probes (valid JSON output)
        shell: bash
        run: |
          for p in hardware-probe system-probe detect-targets security-audit; do
            echo "== $p --json"
            ./scripts/$p.sh --json | "$PY" -m json.tool > /dev/null
          done

      - name: Backup / Restore Smoke Test
        shell: bash
        run: bash tests/backup-smoke.sh

      - name: Probe Fallback Test (unknown instead of invented values)
        shell: bash
        run: bash tests/probe-fallback.sh

      - name: JSON Escaping Test
        shell: bash
        run: bash tests/json-escape.sh
